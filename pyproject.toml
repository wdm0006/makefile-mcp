[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "makefile-mcp"
version = "0.1.0"
description = "MCP server that exposes Makefile targets as executable tools for AI assistants."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
   { name="Will McGinnis", email="will@mcginniscommawill.com" },
]

dependencies = [
    "fastmcp>=3.4.5,<4.0.0"
]

[project.optional-dependencies]
dev = [
    "ruff==0.16.6",
    "pytest",
    "pytest-timeout",
    "pre-commit",
    "mutmut==3.7.0",
]

[project.scripts]
makefile-mcp = "makefile_mcp:main"

[project.urls]
"Homepage" = "https://github.com/wdm0006/makefile-mcp"
"Bug Tracker" = "https://github.com/wdm0006/makefile-mcp/issues"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "C", "B"]
ignore = ["E501", "C901"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Coverage floor lives in the CI/Makefile pytest invocations (not addopts) so
# mutation runs measure test strength, not the coverage gate itself.
addopts = "--timeout=60"

[tool.mutmut]
source_paths = ["makefile_mcp.py"]
